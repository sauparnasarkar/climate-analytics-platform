<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121e35" />
    <!-- iOS Safari ignores the web manifest's display: standalone and keys off these tags
         instead -- without them, "Add to Home Screen" opens a normal browser tab, not a
         standalone app (SPEC.md §5.10). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Degrees of Carbon" />
    <meta name="description" content="Degrees of Carbon: how every tonne becomes a degree. Country CO₂ emissions, forecasts and scenarios, set in the context of atmospheric CO₂ and global warming." />
    <!-- Link previews (iMessage, Slack, WhatsApp, LinkedIn, ...): without these a scraper falls back to apple-touch-icon / the host's
         own logo. Absolute URLs are required; the square app icon is the share image. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Degrees of Carbon" />
    <meta property="og:title" content="Degrees of Carbon: how every tonne becomes a degree" />
    <meta property="og:description" content="Country CO₂ emissions, forecasts and scenarios, set in the context of atmospheric CO₂ and global warming." />
    <meta property="og:url" content="https://degreesofcarbon.syena.io/" />
    <meta property="og:image" content="https://degreesofcarbon.syena.io/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Degrees of Carbon app icon: a globe" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Degrees of Carbon: how every tonne becomes a degree" />
    <meta name="twitter:description" content="Country CO₂ emissions, forecasts and scenarios, set in the context of atmospheric CO₂ and global warming." />
    <meta name="twitter:image" content="https://degreesofcarbon.syena.io/icon-512.png" />
    <title>Degrees of Carbon: how every tonne becomes a degree</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
