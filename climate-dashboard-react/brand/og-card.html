<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Degrees of Carbon share card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style></head>
<body>
<!-- The share card (1200x630). Source of public/og-card.png; render it with scripts/build-brand-assets.mjs. No live figures: the scatter is stylised
     (warming rising with cumulative CO2, coloured by era) so the card never goes stale. -->
<div id="card" style="position:relative;width:1200px;height:630px;overflow:hidden;background:#0b1a2e;font-family:Inter,system-ui,sans-serif;color:#f9fbff">
  <svg width="1200" height="630" viewBox="0 0 1200 630" style="position:absolute;inset:0" id="plot">
    <path d="M0 560H1200M0 470H1200M0 380H1200M0 290H1200M0 200H1200" stroke="#1b2c47" stroke-width="1"/>
    <line x1="60" y1="585" x2="1150" y2="150" stroke="#c1deeb" stroke-width="2.5" stroke-dasharray="10 8" opacity="0.45"/>
  </svg>
  <div style="position:absolute;left:0;right:0;top:112px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center">
    <img src="../public/favicon.svg" width="76" height="76" alt="" style="border-radius:18px;box-shadow:0 0 0 1px #33466b">
    <span style="max-width:600px;font-size:64px;font-weight:700;letter-spacing:-0.025em;line-height:1.05">Degrees of Carbon</span>
    <span style="max-width:600px;font-size:30px;font-weight:500;color:#c9d6ec;letter-spacing:-0.005em;line-height:1.25">How emissions add up to warming</span>
  </div>
  <div style="position:absolute;left:0;right:0;bottom:36px;display:flex;justify-content:center">
    <span style="padding:8px 18px;border-radius:999px;background:rgba(11,26,46,.85);border:1px solid #33466b;font-size:22px;color:#b4c3df;letter-spacing:.01em">degreesofcarbon.syena.io</span>
  </div>
</div>
<script>
  // 175 points, one per year 1850-2024: x and y follow the cumulative-CO2 curve with a fixed pseudo-random scatter, so the picture is the same every render.
  const svg = document.getElementById('plot');
  let dots = '';
  for (let i = 0; i < 175; i++) {
    const yr = 1850 + i, f = i / 174, c = Math.pow(f, 2.4);
    let r1 = Math.sin(i * 12.9898 + 4.1) * 43758.5453; r1 -= Math.floor(r1);
    const x = 60 + c * 1090;
    let y = 585 - c * 435 + (r1 - 0.5) * 70;
    if (yr === 2024) y = 125;
    const behindText = x > 260 && x < 940 && y > 100 && y < 370;
    dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${yr >= 2020 ? 9 : 7}" fill="${yr < 1900 ? '#8eaab7' : yr < 1970 ? '#ffb53b' : '#f2637e'}" opacity="${behindText ? 0.18 : 0.85}"/>`;
  }
  svg.insertAdjacentHTML('beforeend', dots);
</script>
</body></html>
